<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dakotah Howes - Portfolio</title>
  <meta name="description" content="Personal portfolio of Dakotah Howes - marketing, new business, sales, partnerships and client relationships." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- Custom cursor (mouse-move effect) -->
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <!-- Scroll progress bar -->
  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

  <!-- Navigation -->
  <header class="nav" id="nav">
    <a href="#top" class="nav__brand" data-cursor="link">
      <span class="nav__mark">DH</span>
      <span class="nav__name" data-name></span>
    </a>
    <nav class="nav__links" id="nav-links">
      <a href="#about" data-cursor="link">About</a>
      <a href="#capabilities" data-cursor="link">What I do</a>
      <a href="#highlights" data-cursor="link">Highlights</a>
      <a href="#work" data-cursor="link">Work</a>
      <a href="#videos" data-cursor="link">Videos</a>
      <a href="#contact" class="nav__cta" data-cursor="link">Contact</a>
    </nav>
    <button class="nav__toggle" id="theme-toggle" aria-label="Toggle theme" data-cursor="link">
      <span class="nav__toggle-icon">☾</span>
    </button>
    <button class="nav__burger" id="nav-burger" aria-label="Menu"><span></span><span></span></button>
  </header>

  <!-- Content is rendered into <main> from assets/js/content.js -->
  <main id="top"></main>

  <footer class="footer">
    <p>© <span id="year"></span> <span data-name></span>. Built as a living portfolio.</p>
    <p class="footer__note">All content lives in <code>assets/js/content.js</code> - edit there to update the site.</p>
  </footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
